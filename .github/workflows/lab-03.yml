name: Lab 03 security
on:
  push:
    paths: ['lab-03/**', '.github/workflows/lab-03.yml']
  pull_request:
    paths: ['lab-03/**', '.github/workflows/lab-03.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab-03
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: sirius
          POSTGRES_PASSWORD: ci-only-database-password
          POSTGRES_DB: sirius_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sirius -d sirius_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-bookworm
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://sirius:ci-only-database-password@127.0.0.1:5432/sirius_test
      TEST_DATABASE_URL: postgresql+psycopg2://sirius:ci-only-database-password@127.0.0.1:5432/sirius_test
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      JWT_SECRET: ci-only-jwt-signing-key-with-at-least-32-bytes
      DEBUG: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'lab-03/requirements*.txt'
      - run: pip install -r requirements-dev.txt
      - run: python scripts/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab03-security-results
          path: lab-03/docs/test-results.xml

global:
  scrape_interval: 5s
scrape_configs:
  - job_name: sirius_app
    static_configs:
      - targets: ['host.docker.internal:8000']
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ['rabbitmq:15692']
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

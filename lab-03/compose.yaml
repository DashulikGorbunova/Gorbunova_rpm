name: rpm-lab03
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: sirius
      POSTGRES_DB: sirius
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sirius -d sirius"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-bookworm
    ports:
      - "127.0.0.1:16380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:

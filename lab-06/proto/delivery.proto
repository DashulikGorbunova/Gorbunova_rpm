syntax = "proto3";
package delivery.v1;

// Bearer JWT is sent as authorization metadata, never as caller-supplied role/id.
service DeliveryService {
  rpc AssignCourier(AssignCourierRequest) returns (Delivery);
  rpc CompleteDelivery(DeliveryId) returns (Delivery);
  rpc GetDelivery(DeliveryLookup) returns (Delivery);
  rpc ListDeliveries(Empty) returns (DeliveryList);
  rpc AdvanceDelivery(DeliveryId) returns (Delivery);
  rpc TrackDelivery(DeliveryId) returns (stream DeliveryStatus);
  rpc ChatWithCourier(stream ChatMessage) returns (stream ChatMessage);
}
message Empty {}
message AssignCourierRequest { int64 order_id = 1; int64 courier_id = 2; }
message DeliveryId { int64 delivery_id = 1; }
message DeliveryLookup {
  oneof reference { int64 delivery_id = 1; int64 order_id = 2; }
}
message Delivery {
  int64 id = 1;
  int64 order_id = 2;
  int64 customer_id = 3;
  int64 courier_id = 4;
  string status = 5;
}
message DeliveryList { repeated Delivery deliveries = 1; }
message DeliveryStatus {
  int64 delivery_id = 1;
  string status = 2;
  string observed_at = 3;
}
message ChatMessage {
  int64 delivery_id = 1;
  string text = 2;
  // Output fields: clients must leave these empty/zero.
  int64 sender_id = 3;
  int64 sequence = 4;
  string sent_at = 5;
  string event = 6; // "joined" control event or "message".
}
